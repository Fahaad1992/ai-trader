name: SPX adaptive delta and real balance preflight

on:
  push:
    branches:
      - chatgpt/spx-smart-delta-risk-20261026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build SQLite native module and smoke-test actual broker dependencies
        run: |
          npm rebuild better-sqlite3
          node -e "const DB=require('better-sqlite3');const d=new DB(':memory:');if(d.prepare('select 1 as x').get().x!==1)process.exit(2);d.close()"
          node --input-type=module -e "import { IBApi } from '@stoqey/ib';if(typeof IBApi!=='function')process.exit(3)"
      - name: SPX adaptive delta, stop recovery and broker risk regression tests
        run: npx vitest run server/trading/spx-contract-selection.test.ts server/trading/spx-execution-scope.test.ts server/trading/spx-option-tick-quality.test.ts server/trading/broker-exposure-guard.test.ts server/trading/live-safety.test.ts server/options/premium-stop-ladder.test.ts server/options/stop-recovery.test.ts server/options/paper-event-engine.test.ts shared/spx-premium-risk.test.ts
      - name: Legacy full suite (report only; existing unrelated tests can fail)
        continue-on-error: true
        run: npx vitest run
      - name: TypeScript no emit
        run: npx tsc --noEmit
      - name: Build production bundle without running the bot
        run: npm run build
