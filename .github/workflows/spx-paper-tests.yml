name: SPX paper-only unit checks

on:
  push:
    branches:
      - chatgpt/options-premium-ladder-preview-20261026
    paths:
      - server/options/**
      - .github/workflows/spx-paper-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-options-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without running native hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run isolated preview tests
        run: npx vitest run server/options/premium-stop-ladder.test.ts server/options/autonomous-entry-guard.test.ts server/options/paper-event-engine.test.ts
